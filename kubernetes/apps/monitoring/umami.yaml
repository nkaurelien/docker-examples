# Remarque Sécurité : DATABASE_URL, APP_SECRET et POSTGRES_PASSWORD ne sont PAS
# stockés dans ce fichier Git.
#   kubectl create secret generic umami-secrets \
#     --from-env-file=.secrets/umami.env -n monitoring
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: umami-db-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami-db
  namespace: monitoring
  labels:
    app.kubernetes.io/name: umami-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: umami-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: "umami"
            - name: POSTGRES_USER
              value: "umami"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: umami-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 30m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: umami-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: umami-db
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: umami-db
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: monitoring
  labels:
    app.kubernetes.io/name: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami
    spec:
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:postgresql-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: umami-secrets
                  key: DATABASE_URL
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami-secrets
                  key: APP_SECRET
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 30m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: umami
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: umami
  ports:
    - port: 80
      targetPort: 3000
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umami
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - analytics.kamitbrains-minipc-k1.lab
      secretName: umami-tls
  rules:
    - host: analytics.kamitbrains-minipc-k1.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: umami
                port:
                  number: 80
