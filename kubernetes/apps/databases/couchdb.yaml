apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-data
  namespace: databases
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: databases
  labels:
    app.kubernetes.io/name: couchdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: couchdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: couchdb
    spec:
      containers:
        - name: couchdb
          image: couchdb:3.4
          imagePullPolicy: IfNotPresent
          env:
            - name: COUCHDB_USER
              value: "admin"
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-secrets
                  key: COUCHDB_PASSWORD
            - name: COUCHDB_SECRET
              valueFrom:
                secretKeyRef:
                  name: couchdb-secrets
                  key: COUCHDB_SECRET
            - name: NODENAME
              value: "127.0.0.1"
          ports:
            - containerPort: 5984
              name: http
            - containerPort: 4369
              name: epmd
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: couchdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: couchdb
  namespace: databases
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: couchdb
  ports:
    - port: 5984
      targetPort: 5984
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: couchdb
  namespace: databases
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - couchdb.kamitbrains-minipc-k1.lab
      secretName: couchdb-tls
  rules:
    - host: couchdb.kamitbrains-minipc-k1.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: couchdb
                port:
                  number: 5984
