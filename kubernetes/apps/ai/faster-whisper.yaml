apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-models-pvc
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faster-whisper
  namespace: ai
  labels:
    app.kubernetes.io/name: faster-whisper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: faster-whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faster-whisper
    spec:
      containers:
        - name: faster-whisper
          image: lscr.io/linuxserver/faster-whisper:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"
            - name: WHISPER_MODEL
              value: "base-int8"
            - name: WHISPER_BEAM
              value: "1"
            - name: WHISPER_LANG
              value: "auto"
          ports:
            - containerPort: 10300
              name: wyoming
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4096Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: whisper-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: faster-whisper
  namespace: ai
  labels:
    app.kubernetes.io/name: faster-whisper
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: faster-whisper
  ports:
    - port: 10300
      targetPort: 10300
      name: wyoming
