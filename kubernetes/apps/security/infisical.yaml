apiVersion: v1
kind: Namespace
metadata:
  name: security
---
# Remarque Sécurité : Les valeurs sensibles (ENCRYPTION_KEY, AUTH_SECRET, DB_CONNECTION_URI)
# ne sont PAS stockées dans ce fichier Git.
# Elles sont injectées dans le cluster depuis votre fichier sécurisé .secrets/infisical.env via :
# kubectl create secret generic infisical-secrets --from-env-file=.secrets/infisical.env -n security
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical
  namespace: security
  labels:
    app.kubernetes.io/name: infisical
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: infisical
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infisical
    spec:
      containers:
        - name: infisical
          image: infisical/infisical:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
            - name: SITE_URL
              value: "https://infisical.kamitbrains-minipc-k1.lab"
          envFrom:
            - secretRef:
                name: infisical-secrets
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: infisical
  namespace: security
  labels:
    app.kubernetes.io/name: infisical
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: infisical
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infisical
  namespace: security
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - infisical.kamitbrains-minipc-k1.lab
      secretName: infisical-tls
  rules:
    - host: infisical.kamitbrains-minipc-k1.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infisical
                port:
                  number: 8080
