apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

namePrefix: staging-

configMapGenerator:
  - name: api-config
    literals:
      - ENVIRONMENT=staging
      - DEBUG=false
      - APP_NAME=FastAPI (Staging)

patches:
  - target:
      kind: Ingress
      name: fastapi-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api-stage.kamitbrains-minipc-k1.lab
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api-stage.kamitbrains-minipc-k1.lab
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-fastapi-tls
