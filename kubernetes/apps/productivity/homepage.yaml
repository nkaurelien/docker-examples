apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: tools
data:
  settings.yaml: |
    title: "Kamitbrains Homelab"
    background:
      image: ""
      blur: "sm"
      saturate: 50
      brightness: 50
      opacity: 80
    theme: dark
    color: slate
    layout:
      Infrastructure:
        style: row
        columns: 4
      Management & Tools:
        style: row
        columns: 4
      Databases:
        style: row
        columns: 4
      AI & Audio:
        style: row
        columns: 4
      Productivity:
        style: row
        columns: 4

  services.yaml: |
    - Infrastructure:
        - K3s Cluster:
            icon: k3s.png
            href: "https://192.168.0.205:6443"
            description: "Kubernetes Control-Plane"
        - Headlamp:
            icon: kubernetes.png
            href: "https://headlamp.kamitbrains-minipc-k1.lab"
            description: "Cluster Dashboard"
        - Rancher:
            icon: rancher.png
            href: "https://rancher.kamitbrains-minipc-k1.lab"
            description: "Multi-Cluster Manager"
        - Glances:
            icon: glances.png
            href: "https://glances.kamitbrains-minipc-k1.lab"
            description: "System & Hardware Metrics"

    - Management & Tools:
        - IT-Tools:
            icon: it-tools.png
            href: "https://it-tools.kamitbrains-minipc-k1.lab"
            description: "Developer Toolbox"
        - Excalidraw:
            icon: excalidraw.png
            href: "https://draw.kamitbrains-minipc-k1.lab"
            description: "Collaborative Whiteboard"
        - Uptime Kuma:
            icon: uptime-kuma.png
            href: "https://status.kamitbrains-minipc-k1.lab"
            description: "Services Status & Alerts"
        - Umami:
            icon: umami.png
            href: "https://analytics.kamitbrains-minipc-k1.lab"
            description: "Privacy-first Web Analytics"

    - Databases:
        - CouchDB:
            icon: couchdb.png
            href: "https://couchdb.kamitbrains-minipc-k1.lab"
            description: "NoSQL Document Database"
        - PostgreSQL:
            icon: postgresql.png
            href: "postgres.databases.svc.cluster.local:5432"
            description: "Relational Database (v16)"

    - AI & Audio:
        - Faster-Whisper:
            icon: openai.png
            href: "faster-whisper.ai.svc.cluster.local:10300"
            description: "Wyoming Speech-to-Text Server"

    - Productivity:
        - HedgeDoc:
            icon: hedgedoc.png
            href: "https://pad.kamitbrains-minipc-k1.lab"
            description: "Collaborative Markdown Pad"

  widgets.yaml: |
    - logo:
        icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png
    - greeting:
        text_size: xl
        text: "Kamitbrains Homelab"
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showNodes: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: tools
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: homepage-config
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: tools
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - port: 80
      targetPort: 3000
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: tools
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - home.kamitbrains-minipc-k1.lab
      secretName: homepage-tls
  rules:
    - host: home.kamitbrains-minipc-k1.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
