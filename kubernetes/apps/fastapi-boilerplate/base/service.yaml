apiVersion: v1
kind: Service
metadata:
  name: fastapi-api
  labels:
    app.kubernetes.io/name: fastapi-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fastapi-api
  ports:
    # Port 80 exposé au cluster, routé vers le 8000 d'Uvicorn dans le pod :
    # l'Ingress reste inchangé si l'image change de port interne.
    - port: 80
      targetPort: 8000
      name: http
