apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-cluster-cleanup
  namespace: kube-system
spec:
  schedule: "0 3 * * *" # Tous les jours à 03h00 du matin
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cluster-healthcheck
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "=== Kubernetes Scheduled Maintenance / Healthcheck ==="
                  curl -k -s https://kubernetes.default.svc/healthz || exit 1
                  echo "Cluster API is healthy"
          restartPolicy: OnFailure
