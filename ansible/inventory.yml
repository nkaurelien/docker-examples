---
# Inventaire d'EXEMPLE : remplacez les valeurs neutres ci-dessous par celles
# de votre infrastructure (ou gardez-les dans un dépôt privé).
# Les mots de passe sont lus depuis le dossier .secrets/ (non versionné).
all:
  children:
    webservers_fr:
      hosts:
        vps_server:
          ansible_host: 203.0.113.10
          ansible_user: deploy
          ansible_password: "{{ lookup('file', playbook_dir ~ '/../.secrets/ssh-vps-server-password', errors='ignore') | default('', true) | trim }}"
    homelab:
      hosts:
        homelab_server:
          ansible_host: 192.168.1.10
          ansible_fqdn: example.local
          ansible_user: deploy
          ansible_password: "{{ lookup('file', playbook_dir ~ '/../.secrets/ssh-homelab-password', errors='ignore') | default('', true) | trim }}"
    docker_hosts:
      children:
        webservers_fr:
        homelab:
  vars:
    ansible_python_interpreter: /usr/bin/python3
