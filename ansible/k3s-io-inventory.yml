---
k3s_cluster:
  children:
    server:
      hosts:
        k1-mini:
          ansible_host: 192.168.1.10
    agent:
      hosts: {}

  vars:
    ansible_port: 22
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3
    k3s_version: v1.31.12+k3s1
    api_endpoint: "192.168.1.10"
    user_kubectl: true
    airgap_dir: "{{ inventory_dir }}/airgap"
