---
# Rotation des identifiants applicatifs — à lancer à la demande, pas depuis site.yml.
#
#   ansible-playbook -i ansible/inventory.yml ansible/rotate-secrets.yml
#
# Procédure :
#   1. Régénérer la valeur dans .secrets/<service>-admin-password (ignoré par git)
#   2. Lancer ce playbook
#   3. Mettre à jour le coffre Passbolt
#
# Pourquoi un playbook dédié plutôt que site.yml : les rôles utilisent les commandes
# de CRÉATION de compte (`forgejo admin user create`, `manage_users --add`,
# `createsuperuser`). Elles sont sans effet sur un compte existant — rejouer le rôle
# ne rotate donc RIEN. Ce playbook emploie les commandes de CHANGEMENT.
#
# Aucune donnée n'est touchée : ni recréation de conteneur, ni volume supprimé.
- name: Rotation des identifiants applicatifs
  hosts: docker_hosts
  gather_facts: false

  vars:
    secrets_dir: "{{ playbook_dir }}/../.secrets"
    forgejo_user: "{{ lookup('file', secrets_dir ~ '/forgejo-admin-login') | trim }}"
    forgejo_pass: "{{ lookup('file', secrets_dir ~ '/forgejo-admin-password') | trim }}"
    hedgedoc_mail: "{{ lookup('file', secrets_dir ~ '/hedgedoc-admin-login') | trim }}"
    hedgedoc_pass: "{{ lookup('file', secrets_dir ~ '/hedgedoc-admin-password') | trim }}"
    glitchtip_mail: "{{ lookup('file', secrets_dir ~ '/glitchtip-admin-login') | trim }}"
    glitchtip_pass: "{{ lookup('file', secrets_dir ~ '/glitchtip-admin-password') | trim }}"
    databasement_mail: "{{ lookup('file', secrets_dir ~ '/databasement-admin-login') | trim }}"
    databasement_pass: "{{ lookup('file', secrets_dir ~ '/databasement-admin-password') | trim }}"
    gotify_user: "{{ lookup('file', secrets_dir ~ '/gotify-admin-login') | trim }}"
    gotify_pass: "{{ lookup('file', secrets_dir ~ '/gotify-admin-password') | trim }}"
    portabase_db_user: "portabase"
    portabase_db_pass: "{{ lookup('file', secrets_dir ~ '/portabase-db-password') | trim }}"

  tasks:
    - name: Forgejo — changer le mot de passe admin
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -u
          - git
          - forgejo
          - forgejo
          - admin
          - user
          - change-password
          - --username
          - "{{ forgejo_user }}"
          - --password
          - "{{ forgejo_pass }}"
      register: forgejo_rotate
      changed_when: forgejo_rotate.rc == 0
      failed_when: false
      no_log: true

    - name: Forgejo — résultat
      ansible.builtin.debug:
        msg: "forgejo : {{ 'OK' if forgejo_rotate.rc == 0 else 'ECHEC rc=' ~ forgejo_rotate.rc }}"

    # L'email doit suivre IMMÉDIATEMENT --reset ; --pass se place avant.
    # `--pass X --reset <email>` fonctionne, `--reset --pass X <email>` échoue.
    - name: HedgeDoc — réinitialiser le mot de passe admin
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - hedgedoc
          - bin/manage_users
          - --pass
          - "{{ hedgedoc_pass }}"
          - --reset
          - "{{ hedgedoc_mail }}"
      register: hedgedoc_rotate
      changed_when: "'has been reset' in (hedgedoc_rotate.stdout | default(''))"
      failed_when: false
      no_log: true

    - name: HedgeDoc — créer le compte s'il n'existait pas encore
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - hedgedoc
          - bin/manage_users
          - --pass
          - "{{ hedgedoc_pass }}"
          - --add
          - "{{ hedgedoc_mail }}"
      when: "'has been reset' not in (hedgedoc_rotate.stdout | default(''))"
      register: hedgedoc_create
      changed_when: "'Created user' in (hedgedoc_create.stdout | default(''))"
      failed_when: false
      no_log: true

    - name: HedgeDoc — résultat
      ansible.builtin.debug:
        msg: >-
          hedgedoc : {{ 'mot de passe réinitialisé'
            if 'has been reset' in (hedgedoc_rotate.stdout | default(''))
            else ('compte créé' if 'Created user' in (hedgedoc_create.stdout | default(''))
            else 'ECHEC — vérifier que le conteneur est healthy') }}

    # set_password() préserve intégralement les données (projets, équipes, événements).
    # createsuperuser, utilisé par le rôle, n'agit pas sur un compte existant.
    - name: GlitchTip — changer le mot de passe du superuser (sans perte de données)
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - glitchtip
          - python
          - manage.py
          - shell
          - -c
          - |
            from django.contrib.auth import get_user_model
            U = get_user_model()
            u = U.objects.filter(email__iexact="{{ glitchtip_mail }}").first()
            if u is None:
                print("INTROUVABLE")
            else:
                u.set_password("{{ glitchtip_pass }}")
                u.save()
                print("CHANGE")
      register: glitchtip_rotate
      changed_when: "'CHANGE' in (glitchtip_rotate.stdout | default(''))"
      failed_when: false
      no_log: true

    - name: GlitchTip — résultat
      ansible.builtin.debug:
        msg: >-
          glitchtip : {{ 'OK — données préservées'
            if 'CHANGE' in (glitchtip_rotate.stdout | default(''))
            else ('compte admin INTROUVABLE' if 'INTROUVABLE' in (glitchtip_rotate.stdout | default(''))
            else 'ECHEC rc=' ~ glitchtip_rotate.rc) }}

    # Laravel : le rôle utilise firstOrCreate(), qui n'agit pas sur un compte existant.
    # forceFill + save() met à jour le hash sans toucher au reste de l'enregistrement.
    - name: Databasement — changer le mot de passe admin (sans perte de données)
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - databasement
          - php
          - artisan
          - tinker
          - --execute
          - >-
            $u = App\Models\User::where('email', '{{ databasement_mail }}')->first();
            if ($u) { $u->forceFill(['password' => Hash::make('{{ databasement_pass }}')])->save(); echo "CHANGE"; }
            else { echo "INTROUVABLE"; }
      register: databasement_rotate
      changed_when: "'CHANGE' in (databasement_rotate.stdout | default(''))"
      failed_when: false
      no_log: true

    - name: Databasement — résultat
      ansible.builtin.debug:
        msg: >-
          databasement : {{ 'OK — données préservées'
            if 'CHANGE' in (databasement_rotate.stdout | default(''))
            else ('compte INTROUVABLE' if 'INTROUVABLE' in (databasement_rotate.stdout | default(''))
            else 'ECHEC — conteneur arrêté ?') }}

    # GOTIFY_DEFAULTUSER_PASS ne s'applique qu'à l'initialisation de la base.
    # On met donc à jour directement le hash bcrypt dans SQLite : aucune donnée perdue,
    # et cela fonctionne même conteneur arrêté.
    - name: Gotify — calculer le hash bcrypt du nouveau mot de passe
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -e
          - P
          - python:3-alpine
          - sh
          - -c
          - "pip install -q bcrypt && python -c \"import bcrypt,os;print(bcrypt.hashpw(os.environ['P'].encode(),bcrypt.gensalt()).decode())\""
      # `environment` est un mot-clé de TÂCHE : imbriqué sous le module, il serait
      # passé comme paramètre du module et la variable ne serait jamais transmise.
      environment:
        P: "{{ gotify_pass }}"
      register: gotify_hash
      changed_when: false
      failed_when: false
      no_log: true

    # Le hash bcrypt contient des `$` ($2b$12$...). Passé dans un `sh -c`, le shell les
    # interprète comme des variables et le hash arrive tronqué. On écrit donc le SQL dans
    # un fichier (Ansible gère l'échappement) que sqlite3 lit en entrée : aucune expansion.
    - name: Gotify — préparer le SQL de mise à jour
      ansible.builtin.copy:
        content: |
          UPDATE users SET pass='{{ gotify_hash.stdout_lines | default([]) | last | default('') | trim }}' WHERE name='{{ gotify_user }}';
          SELECT changes();
        dest: /tmp/gotify-rotate.sql
        mode: '0600'
      when: "(gotify_hash.stdout_lines | default([]) | last | default('')) is search('^\\$2[aby]\\$')"
      no_log: true

    - name: Gotify — appliquer le hash dans la base SQLite
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - gotify_gotify-data:/d
          - -v
          - /tmp/gotify-rotate.sql:/q.sql:ro
          - alpine
          - sh
          - -c
          - "apk add -q sqlite && sqlite3 /d/gotify.db < /q.sql"
      when: "(gotify_hash.stdout_lines | default([]) | last | default('')) is search('^\\$2[aby]\\$')"
      register: gotify_rotate
      changed_when: "(gotify_rotate.stdout | default('0') | trim) != '0'"
      failed_when: false

    - name: Gotify — supprimer le SQL temporaire
      ansible.builtin.file:
        path: /tmp/gotify-rotate.sql
        state: absent


    - name: Gotify — résultat
      ansible.builtin.debug:
        msg: >-
          gotify : {{ 'OK — ' ~ (gotify_rotate.stdout | default('0') | trim) ~ ' compte(s) mis à jour'
            if (gotify_rotate.stdout | default('0') | trim) not in ['0', '']
            else 'ECHEC — hash non calculé ou compte absent' }}

    # PostgreSQL ignore POSTGRES_PASSWORD sur un volume déjà initialisé : il faut un
    # ALTER USER, puis redémarrer l'application pour qu'elle relise la nouvelle valeur.
    - name: Portabase — changer le mot de passe PostgreSQL
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - portabase-db
          - psql
          - -U
          - "{{ portabase_db_user }}"
          - -d
          - postgres
          - -c
          - "ALTER USER {{ portabase_db_user }} WITH PASSWORD '{{ portabase_db_pass }}';"
      register: portabase_alter
      changed_when: "'ALTER ROLE' in (portabase_alter.stdout | default(''))"
      failed_when: false
      no_log: true

    - name: Portabase — redéployer la stack pour propager la nouvelle valeur
      community.docker.docker_compose_v2:
        project_src: "{{ portabase_compose_dir | default('/opt/portabase') }}"
        state: present
        recreate: always
      when: "'ALTER ROLE' in (portabase_alter.stdout | default(''))"
      register: portabase_redeploy
      failed_when: false

    - name: Portabase — résultat
      ansible.builtin.debug:
        msg: >-
          portabase : {{ 'OK — mot de passe DB changé et stack redéployée'
            if 'ALTER ROLE' in (portabase_alter.stdout | default(''))
            else 'ECHEC — ' ~ (portabase_alter.stderr | default('') | truncate(120)) }}

    # Erugo : le mot de passe admin n'est pas géré par Ansible, il est défini dans
    # l'assistant de premier démarrage. Tant qu'aucun utilisateur n'existe, mettre à
    # jour .secrets/erugo-admin-password suffit. Ensuite, passer par l'interface web.
    #
    # Backrest : l'authentification se configure dans l'interface web, qui écrit
    # /config/config.json. Tant que ce fichier n'existe pas, aucun compte n'est défini
    # et mettre à jour .secrets/backrest-admin-password suffit.
    #
    # Jupyter : `jupyter_token` est lu depuis .secrets/jupyter-admin-token et injecté
    # au démarrage du conteneur. La rotation se fait en redéployant le rôle :
    #   ansible-playbook -i ansible/inventory.yml ansible/site.yml --tags jupyter
