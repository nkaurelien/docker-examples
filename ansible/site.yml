---
- name: Setup Infrastructure & Docker Environment
  hosts: docker_hosts
  become: true
  roles:
    - role: common
      tags: [common, system]
    - role: docker-daemon
      tags: [docker, daemon]
    - role: ssl-certs
      tags: [ssl, security]
    - role: traefik
      tags: [traefik, proxy, reverse-proxy]
    - role: glances
      tags: [glances, monitoring]
    - role: arcane
      tags: [arcane, manager, paas]
    - role: crowdsec
      tags: [crowdsec, security, ids]
    - role: uptime-kuma
      tags: [uptime-kuma, status, monitoring]
    - role: ntfy
      tags: [ntfy, notification, communication]
    - role: passbolt
      tags: [passbolt, passwords, auth, security]
    - role: changedetection
      tags: [changedetection, surveillance, monitoring]
    - role: it-tools
      tags: [it-tools, tools, dev]
    - role: bentopdf
      tags: [bentopdf, pdf, tools, dev]
    - role: stirling-pdf
      tags: [stirling-pdf, stirling, pdf, tools, dev]
    - role: tinyauth
      tags: [tinyauth, sso, auth, security]
    - role: erugo
      tags: [erugo, share, files, tools]
    - role: pairdrop
      tags: [pairdrop, drop, p2p, files, tools]
    - role: hedgedoc
      tags: [hedgedoc, pad, markdown, docs, tools]
    - role: excalidraw
      tags: [excalidraw, draw, whiteboard, diagrams, tools]
    - role: dozzle
      tags: [dozzle, logs, docker, monitoring, tools]
    - role: forgejo
      tags: [forgejo, git, code, dev, tools]
    - role: cockpit
      tags: [cockpit, admin, system, monitoring, tools]
    - role: glitchtip
      tags: [glitchtip, apm, errors, monitoring, dev, tools]
    - role: homepage
      tags: [homepage, dashboard, portal, home, apps]

- name: Maintenance and Cleanup Tasks
  hosts: docker_hosts
  become: true
  tasks:
    - name: Run deploy cleanup
      ansible.builtin.include_role:
        name: deploy-cleanup
      tags: [cleanup, maintenance]
