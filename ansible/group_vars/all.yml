---
# Global variables for Ansible infrastructure roles
traefik_domain: "kamitbrains.fr"
traefik_public_network: "traefik-public"
rsync_host_install_required: false
server_user: "asone4health"
app_user_group: "asone4health"
app_domain: "asone4health.fr"
local_project_dir: "{{ playbook_dir }}/.."
ssl_cert_file: "nginx_bundle.crt"
ssl_key_file: "private.key"





# Common role vars
common_packages:
  - curl
  - wget
  - git
  - htop
  - ca-certificates
  - gnupg

# Docker daemon configuration
docker_daemon_config:
  log-driver: "json-file"
  log-opts:
    max-size: "10m"
    max-file: "3"
  storage-driver: "overlay2"

# SSL configuration
ssl_certs_dir: "/etc/ssl/custom"
ssl_generate_self_signed: true
ssl_domain: "localhost"

# Systemd services configuration
systemd_services: []

# Deploy cleanup configuration
cleanup_docker_prune: true
cleanup_keep_days: 7
