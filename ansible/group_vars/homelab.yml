---
# Configuration d'EXEMPLE du serveur homelab (valeurs neutres à adapter)
homelab_server_ip: "192.168.1.10"
homelab_server_fqdn: "example.local"

ansible_host: "{{ homelab_server_ip }}"
ansible_user: "deploy"
ansible_password: "{{ lookup('file', playbook_dir ~ '/../.secrets/ssh-homelab-password', errors='ignore') | default('', true) | trim }}"
ansible_become_password: "{{ ansible_password }}"

app_namespace: homelab
app_domain_tld: local
traefik_domain: "example.local"
