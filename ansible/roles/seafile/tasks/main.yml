---
- name: Ensure Seafile deployment directory exists
  ansible.builtin.file:
    path: "{{ seafile_deploy_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Seafile docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ seafile_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Seafile container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ seafile_deploy_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Seafile systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "seafile"
    systemd_service_description: "Seafile Enterprise File Sync and Share Platform"
    systemd_compose_dir: "{{ seafile_deploy_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "seafile"
