---
# Seafile role defaults
seafile_domain: "{{ traefik_domain | default('kamitbrains.fr') }}"
seafile_hostname: "seafile.{{ seafile_domain }}"
seafile_alias_hostname: "drive.{{ seafile_domain }}"
seafile_deploy_dir: "/opt/seafile"

seafile_admin_email: "{{ lookup('file', '/Volumes/X9 Pro/Workspaces/nkaurelien/docker-examples/.secrets/seafile-admin-email') | trim | default('admin@kamitbrains.fr') }}"
seafile_admin_password: "{{ lookup('file', '/Volumes/X9 Pro/Workspaces/nkaurelien/docker-examples/.secrets/seafile-admin-password') | trim }}"
seafile_db_password: "{{ lookup('file', '/Volumes/X9 Pro/Workspaces/nkaurelien/docker-examples/.secrets/seafile-db-password') | trim }}"
