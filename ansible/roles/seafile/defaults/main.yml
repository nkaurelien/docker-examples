---
# Seafile role defaults
seafile_domain: "{{ traefik_domain | default('example.com') }}"
seafile_hostname: "seafile.{{ seafile_domain }}"
seafile_alias_hostname: "drive.{{ seafile_domain }}"
seafile_deploy_dir: "/opt/seafile"

seafile_admin_email: "{{ lookup('file', playbook_dir ~ '/../.secrets/seafile-admin-email') | trim | default('admin@example.com') }}"
seafile_admin_password: "{{ lookup('file', playbook_dir ~ '/../.secrets/seafile-admin-password') | trim }}"
seafile_db_password: "{{ lookup('file', playbook_dir ~ '/../.secrets/seafile-db-password') | trim }}"
