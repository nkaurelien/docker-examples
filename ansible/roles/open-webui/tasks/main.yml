---
- name: Ensure Open WebUI deployment directory exists
  ansible.builtin.file:
    path: "{{ open_webui_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Open WebUI docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ open_webui_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Open WebUI container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ open_webui_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Open WebUI systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "open-webui"
    systemd_service_description: "Open WebUI AI User Interface Service"
    systemd_compose_dir: "{{ open_webui_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "open-webui"
