---
- name: Ensure HedgeDoc deployment, data, and uploads directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - "{{ hedgedoc_compose_dir }}"
    - "{{ hedgedoc_compose_dir }}/data"
    - "{{ hedgedoc_compose_dir }}/uploads"

- name: Deploy HedgeDoc docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hedgedoc_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start HedgeDoc container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ hedgedoc_compose_dir }}"
    state: present
    recreate: always
    remove_orphans: true

- name: Initialize HedgeDoc admin user account via bin/manage_users
  community.docker.docker_container_exec:
    container: hedgedoc
    command: "bin/manage_users --pass '{{ hedgedoc_admin_password }}' --add '{{ hedgedoc_admin_email }}'"
  ignore_errors: true

- name: Install and enable HedgeDoc systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "hedgedoc"
    systemd_service_description: "HedgeDoc Collaborative Markdown Editor Service"
    systemd_compose_dir: "{{ hedgedoc_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "hedgedoc"
