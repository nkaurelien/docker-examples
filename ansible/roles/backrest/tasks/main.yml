---
- name: Ensure Backrest deployment directory exists
  ansible.builtin.file:
    path: "{{ backrest_deploy_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Backrest docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ backrest_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Backrest container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ backrest_deploy_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Backrest systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "backrest"
    systemd_service_description: "Backrest Web UI and Orchestrator for Restic Backup"
    systemd_compose_dir: "{{ backrest_deploy_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "backrest"
