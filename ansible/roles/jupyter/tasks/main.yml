---
- name: Ensure JupyterLab deployment and workspace directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - "{{ jupyter_deploy_dir }}"
    - "{{ jupyter_deploy_dir }}/data"

- name: Deploy JupyterLab docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jupyter_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start JupyterLab container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ jupyter_deploy_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable JupyterLab systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "jupyter"
    systemd_service_description: "JupyterLab Interactive AI & Data Science Environment"
    systemd_compose_dir: "{{ jupyter_deploy_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "jupyter"
