---
# JupyterLab role defaults
jupyter_image: "quay.io/jupyter/datascience-notebook:latest"
jupyter_domain: "example.com"
jupyter_hostname: "jupyter.{{ traefik_domain | default(jupyter_domain) }}"
jupyter_alias_hostname: "notebook.{{ traefik_domain | default(jupyter_domain) }}"
jupyter_deploy_dir: "/opt/jupyter"
jupyter_container_port: 8888
jupyter_token: "{{ lookup('file', playbook_dir ~ '/../.secrets/jupyter-admin-token') | trim }}"
