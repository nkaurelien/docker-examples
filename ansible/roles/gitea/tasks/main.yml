---
- name: Ensure Gitea deployment and configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0775'
    owner: "1000"
    group: "1000"
  loop:
    - "{{ gitea_deploy_dir }}"
    - "{{ gitea_deploy_dir }}/data"
    - "{{ gitea_deploy_dir }}/data/gitea"
    - "{{ gitea_deploy_dir }}/data/gitea/conf"
    - "{{ gitea_deploy_dir }}/postgres"

- name: Deploy Gitea app.ini configuration file
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ gitea_deploy_dir }}/data/gitea/conf/app.ini"
    mode: '0644'

- name: Deploy Gitea docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ gitea_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy Gitea docker-compose Traefik override configuration
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ gitea_deploy_dir }}/docker-compose.override.yml"
    mode: '0644'

- name: Start Gitea container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ gitea_deploy_dir }}"
    files:
      - docker-compose.yml
      - docker-compose.override.yml
    state: present
    remove_orphans: true

- name: Initialize Gitea admin user account via CLI
  community.docker.docker_container_exec:
    container: gitea
    user: "1000"
    command: "gitea admin user create --admin --username {{ gitea_admin_username }} --password '{{ gitea_admin_password }}' --email '{{ gitea_admin_email }}' --must-change-password=false"
  ignore_errors: true

- name: Install and enable Gitea systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "gitea"
    systemd_service_description: "Gitea Self-Hosted Git Platform Service"
    systemd_compose_dir: "{{ gitea_deploy_dir }}"
    systemd_compose_files: "-f docker-compose.yml -f docker-compose.override.yml"
    systemd_project_name: "gitea"
