---
- name: Ensure Portabase deployment directory exists
  ansible.builtin.file:
    path: "{{ portabase_deploy_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Portabase docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portabase_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Portabase container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ portabase_deploy_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Portabase systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "portabase"
    systemd_service_description: "Portabase Database Backup Manager & Web UI"
    systemd_compose_dir: "{{ portabase_deploy_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "portabase"
