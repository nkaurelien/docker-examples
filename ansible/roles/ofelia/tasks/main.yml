---
- name: Ensure Ofelia deployment directory exists
  ansible.builtin.file:
    path: "{{ ofelia_deploy_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Ofelia docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ofelia_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Ofelia container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ ofelia_deploy_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Ofelia systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "ofelia"
    systemd_service_description: "Ofelia Docker-Native Job Scheduler"
    systemd_compose_dir: "{{ ofelia_deploy_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "ofelia"
