---
- name: Ensure PairDrop deployment directory exists
  ansible.builtin.file:
    path: "{{ pairdrop_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy PairDrop docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pairdrop_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start PairDrop container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ pairdrop_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable PairDrop systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "pairdrop"
    systemd_service_description: "PairDrop P2P WebRTC File Transfer Service"
    systemd_compose_dir: "{{ pairdrop_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "pairdrop"
