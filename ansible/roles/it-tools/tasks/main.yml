---
- name: Ensure IT-Tools deployment directory exists
  ansible.builtin.file:
    path: "{{ it_tools_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy IT-Tools docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ it_tools_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start IT-Tools container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ it_tools_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable IT-Tools systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "it-tools"
    systemd_service_description: "IT-Tools Web Developer Tools Collection"
    systemd_compose_dir: "{{ it_tools_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "it-tools"
