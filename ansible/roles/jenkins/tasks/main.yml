---
- name: Ensure Jenkins deployment directory exists
  ansible.builtin.file:
    path: "{{ jenkins_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Jenkins docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jenkins_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Jenkins container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ jenkins_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Jenkins systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "jenkins"
    systemd_service_description: "Jenkins Continuous Integration and Deployment Server"
    systemd_compose_dir: "{{ jenkins_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "jenkins"
