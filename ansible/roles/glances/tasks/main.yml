---
- name: Ensure Glances deployment directory exists
  ansible.builtin.file:
    path: "{{ glances_compose_dir }}"
    state: directory
    mode: '0755'

- name: Compute htpasswd SHA1 entry for Glances Basic Auth
  ansible.builtin.shell:
    cmd: >
      python3 -c "import base64, hashlib; pwd = '''{{ glances_basic_auth_password }}'''; print('{{ glances_basic_auth_user | default('admin') }}:{SHA}' + base64.b64encode(hashlib.sha1(pwd.encode()).digest()).decode())"
  register: _glances_htpasswd_res
  changed_when: false

- name: Deploy Traefik Basic Auth middleware for Glances
  ansible.builtin.template:
    src: traefik-glances-auth.yml.j2
    dest: "/opt/traefik/config/dynamic/glances-auth.yml"
    mode: '0644'
  vars:
    glances_htpasswd_user_entry: "{{ _glances_htpasswd_res.stdout }}"

- name: Deploy Glances docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ glances_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Remove legacy conflicting glances-socket-proxy container if present
  ansible.builtin.command:
    cmd: "docker rm -f glances-socket-proxy"
  failed_when: false
  changed_when: false

- name: Start Glances container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ glances_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Glances systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "glances"
    systemd_service_description: "Glances System & Container Monitoring"
    systemd_compose_dir: "{{ glances_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "glances"
