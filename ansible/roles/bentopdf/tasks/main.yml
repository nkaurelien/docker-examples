---
- name: Ensure BentoPDF deployment directory exists
  ansible.builtin.file:
    path: "{{ bentopdf_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy BentoPDF docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bentopdf_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start BentoPDF container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ bentopdf_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable BentoPDF systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "bentopdf"
    systemd_service_description: "BentoPDF Privacy-First PDF Toolkit Service"
    systemd_compose_dir: "{{ bentopdf_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "bentopdf"
