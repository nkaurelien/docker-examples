---
- name: Ensure TinyAuth deployment directory exists
  ansible.builtin.file:
    path: "{{ tinyauth_compose_dir }}"
    state: directory
    mode: '0755'

- name: Generate bcrypt user entries for TinyAuth
  ansible.builtin.shell:
    cmd: >
      docker run --rm {{ tinyauth_image }} user create --username "{{ item.username }}" --password "{{ item.password }}" --docker 2>&1 | grep -o 'user=.*' | cut -d= -f2 | sed -E 's/\x1B\[[0-9;]*[a-zA-Z]//g'
  loop: "{{ tinyauth_users }}"
  register: _tinyauth_users_res
  changed_when: false

- name: Deploy TinyAuth docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ tinyauth_compose_dir }}/docker-compose.yml"
    mode: '0644'
  vars:
    tinyauth_users_string: "{{ _tinyauth_users_res.results | map(attribute='stdout') | join(',') }}"

- name: Start TinyAuth container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ tinyauth_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable TinyAuth systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "tinyauth"
    systemd_service_description: "TinyAuth SSO Authentication ForwardAuth Middleware"
    systemd_compose_dir: "{{ tinyauth_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "tinyauth"
