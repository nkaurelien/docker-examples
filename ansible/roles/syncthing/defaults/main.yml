---
# Syncthing role defaults
syncthing_domain: "{{ traefik_domain | default('kamitbrains.fr') }}"
syncthing_hostname: "syncthing.{{ syncthing_domain }}"
syncthing_alias_hostname: "sync.{{ syncthing_domain }}"
syncthing_deploy_dir: "/opt/syncthing"

syncthing_admin_user: "{{ lookup('file', '/Volumes/X9 Pro/Workspaces/nkaurelien/docker-examples/.secrets/syncthing-admin-login') | trim | default('admin') }}"
syncthing_admin_password: "{{ lookup('file', '/Volumes/X9 Pro/Workspaces/nkaurelien/docker-examples/.secrets/syncthing-admin-password') | trim }}"
