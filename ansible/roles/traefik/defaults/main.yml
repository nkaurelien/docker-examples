---
# Traefik role defaults
traefik_version: "v3.6"
traefik_domain: "kamitbrains.fr"
traefik_public_network: "traefik-public"
traefik_acme_email: "nkaurelien@gmail.com"
traefik_enable_letsencrypt: true
traefik_dashboard_host: "traefik.{{ traefik_domain }}"
traefik_http_port: 80
traefik_https_port: 443
traefik_dashboard_port: 8088
traefik_compose_dir: "/opt/traefik"

# Dashboard authentication defaults
traefik_dashboard_basic_auth_user: "admin"
traefik_dashboard_basic_auth_password: "{{ lookup('file', '/Volumes/X9 Pro/Workspaces/nkaurelien/docker-examples/.secrets/traefik-dashboard-basic-auth-password', errors='ignore') | default('traefik-dashboard-password-change-me', true) | trim }}"
