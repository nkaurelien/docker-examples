---
- name: Ensure Traefik public network exists
  community.docker.docker_network:
    name: "{{ traefik_public_network }}"
    state: present

- name: Ensure Traefik deployment directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ traefik_compose_dir }}"
    - "{{ traefik_compose_dir }}/config/dynamic"

- name: Compute htpasswd SHA1 entry for Traefik Dashboard Basic Auth
  ansible.builtin.shell:
    cmd: >
      python3 -c "import base64, hashlib; pwd = '''{{ traefik_dashboard_basic_auth_password }}'''; print('{{ traefik_dashboard_basic_auth_user | default('admin') }}:{SHA}' + base64.b64encode(hashlib.sha1(pwd.encode()).digest()).decode())"
  register: _traefik_dashboard_htpasswd_res
  changed_when: false

- name: Deploy Traefik Basic Auth middleware for Dashboard
  ansible.builtin.template:
    src: traefik-dashboard-auth.yml.j2
    dest: "/opt/traefik/config/dynamic/dashboard-auth.yml"
    mode: '0644'
  vars:
    traefik_dashboard_htpasswd_user_entry: "{{ _traefik_dashboard_htpasswd_res.stdout }}"

- name: Deploy Traefik Dashboard router configuration
  ansible.builtin.template:
    src: traefik-dashboard-router.yml.j2
    dest: "/opt/traefik/config/dynamic/dashboard-router.yml"
    mode: '0644'

- name: Deploy Traefik CrowdSec ForwardAuth middleware configuration
  ansible.builtin.template:
    src: traefik-crowdsec-middleware.yml.j2
    dest: "/opt/traefik/config/dynamic/crowdsec-bouncer.yml"
    mode: '0644'

- name: Deploy Traefik docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_compose_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart Traefik service

- name: Remove legacy conflicting socket-proxy container if present
  ansible.builtin.command:
    cmd: "docker rm -f traefik-socket-proxy"
  failed_when: false
  changed_when: false

- name: Start Traefik container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Traefik systemd service for automatic reboot start
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "traefik"
    systemd_service_description: "Traefik v3 Reverse Proxy Edge Router"
    systemd_compose_dir: "{{ traefik_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "traefik"
