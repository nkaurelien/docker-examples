---
- name: Ensure GlitchTip deployment directory exists
  ansible.builtin.file:
    path: "{{ glitchtip_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy GlitchTip docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ glitchtip_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start GlitchTip container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ glitchtip_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable GlitchTip systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "glitchtip"
    systemd_service_description: "GlitchTip Error Tracking & APM Platform"
    systemd_compose_dir: "{{ glitchtip_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "glitchtip"
