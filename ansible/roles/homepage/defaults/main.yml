---
# Homepage role defaults
homepage_image: "ghcr.io/gethomepage/homepage:latest"
homepage_domain: "kamitbrains.fr"
homepage_primary_hostname: "home.{{ traefik_domain | default(homepage_domain) }}"
homepage_alias_hostname: "apps.{{ traefik_domain | default(homepage_domain) }}"
homepage_compose_dir: "/opt/homepage"
homepage_config_dir: "/opt/homepage/config"
homepage_finnhub_api_key: "{{ lookup('file', playbook_dir ~ '/../.secrets/finnhub-api-key', errors='ignore') | default('', true) | trim }}"
