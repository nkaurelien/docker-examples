---
- name: Ensure Homepage deployment and config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ homepage_compose_dir }}"
    - "{{ homepage_config_dir }}"
    - "{{ homepage_compose_dir }}/images"

- name: Deploy Homepage docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homepage_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy Homepage custom logo SVG file
  ansible.builtin.copy:
    src: logo.svg
    dest: "{{ item }}"
    mode: '0644'
  loop:
    - "{{ homepage_config_dir }}/logo.svg"
    - "{{ homepage_compose_dir }}/images/logo.svg"

- name: Deploy Homepage configuration files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ homepage_config_dir }}/{{ item }}"
    mode: '0644'
  loop:
    - settings.yaml
    - services.yaml
    - widgets.yaml
    - bookmarks.yaml

- name: Start Homepage container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ homepage_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Homepage systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "homepage"
    systemd_service_description: "Homepage Infrastructure Dashboard Portal"
    systemd_compose_dir: "{{ homepage_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "homepage"
