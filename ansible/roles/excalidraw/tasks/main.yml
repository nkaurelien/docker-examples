---
- name: Ensure Excalidraw deployment directory exists
  ansible.builtin.file:
    path: "{{ excalidraw_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Excalidraw docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ excalidraw_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Excalidraw container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ excalidraw_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Excalidraw systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "excalidraw"
    systemd_service_description: "Excalidraw Virtual Whiteboard Service"
    systemd_compose_dir: "{{ excalidraw_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "excalidraw"
