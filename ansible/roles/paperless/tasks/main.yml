---
- name: Ensure Paperless-ngx deployment and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - "{{ paperless_deploy_dir }}"
    - "{{ paperless_deploy_dir }}/export"
    - "{{ paperless_deploy_dir }}/consume"

- name: Deploy Paperless-ngx docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ paperless_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Paperless-ngx container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ paperless_deploy_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Paperless-ngx systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "paperless"
    systemd_service_description: "Paperless-ngx Open Source Document Management System"
    systemd_compose_dir: "{{ paperless_deploy_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "paperless"
