---
- name: Ensure Faster-Whisper deployment directory exists
  ansible.builtin.file:
    path: "{{ faster_whisper_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Faster-Whisper docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ faster_whisper_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Faster-Whisper container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ faster_whisper_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Faster-Whisper systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "faster-whisper"
    systemd_service_description: "Faster-Whisper STT Wyoming Service"
    systemd_compose_dir: "{{ faster_whisper_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "faster-whisper"
