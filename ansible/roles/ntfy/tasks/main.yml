---
- name: Ensure ntfy deployment directory exists
  ansible.builtin.file:
    path: "{{ ntfy_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy ntfy docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ntfy_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start ntfy container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ ntfy_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable ntfy systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "ntfy"
    systemd_service_description: "Ntfy Push Notification Service"
    systemd_compose_dir: "{{ ntfy_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "ntfy"
