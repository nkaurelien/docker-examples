---
- name: Ensure Umami deployment directory exists
  ansible.builtin.file:
    path: "{{ umami_deploy_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Umami docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ umami_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Umami container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ umami_deploy_dir }}"
    state: present
    remove_orphans: true

- name: Check and initialize Umami admin password if default password 'umami' is active
  community.docker.docker_container_exec:
    container: umami
    command: >
      sh -c '
        LOGIN_RES=$(curl -s -X POST http://localhost:3000/api/auth/login -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"umami\"}");
        if echo "$LOGIN_RES" | grep -q "token"; then
          TOKEN=$(echo "$LOGIN_RES" | sed -n "s/.*\"token\":\"\([^\"]*\)\".*/\1/p");
          USER_ID=$(echo "$LOGIN_RES" | sed -n "s/.*\"id\":\"\([^\"]*\)\".*/\1/p");
          curl -s -X POST "http://localhost:3000/api/users/$USER_ID" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"password\":\"{{ umami_admin_password }}\"}";
          echo "ADMIN_PASSWORD_INITIALIZED";
        else
          echo "ADMIN_PASSWORD_ALREADY_SET";
        fi
      '
  register: umami_init_result
  changed_when: umami_init_result.stdout is defined and "ADMIN_PASSWORD_INITIALIZED" in umami_init_result.stdout

- name: Ensure configured websites exist in Umami
  community.docker.docker_container_exec:
    container: umami
    command: >
      sh -c '
        LOGIN_RES=$(curl -s -X POST http://localhost:3000/api/auth/login -H "Content-Type: application/json" -d "{\"username\":\"{{ umami_admin_user }}\",\"password\":\"{{ umami_admin_password }}\"}");
        TOKEN=$(echo "$LOGIN_RES" | sed -n "s/.*\"token\":\"\([^\"]*\)\".*/\1/p");
        if [ -n "$TOKEN" ]; then
          WEBSITES=$(curl -s -H "Authorization: Bearer $TOKEN" http://localhost:3000/api/websites);
          if ! echo "$WEBSITES" | grep -q "{{ item.domain }}"; then
            curl -s -X POST http://localhost:3000/api/websites -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"name\":\"{{ item.name }}\",\"domain\":\"{{ item.domain }}\"}";
            echo "WEBSITE_CREATED_{{ item.domain }}";
          else
            echo "WEBSITE_EXISTS_{{ item.domain }}";
          fi
        fi
      '
  loop: "{{ umami_websites }}"
  register: umami_website_results
  changed_when: item.stdout is defined and "WEBSITE_CREATED_" in item.stdout

- name: Install and enable Umami systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "umami"
    systemd_service_description: "Umami Open Source Web Analytics Platform"
    systemd_compose_dir: "{{ umami_deploy_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "umami"
