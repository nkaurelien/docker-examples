---
- name: Ensure Gotify deployment directory exists
  ansible.builtin.file:
    path: "{{ gotify_deploy_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Gotify docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ gotify_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Gotify container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ gotify_deploy_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Gotify systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "gotify"
    systemd_service_description: "Gotify Real-Time Push Notification Server"
    systemd_compose_dir: "{{ gotify_deploy_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "gotify"
