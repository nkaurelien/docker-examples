---
# Arcane Docker Manager role defaults
arcane_version: "latest"
arcane_image: "ghcr.io/getarcaneapp/manager:{{ arcane_version }}"
arcane_port: 3552
arcane_domain: "{{ traefik_domain | default('example.com') }}"
arcane_hostname: "arcane.{{ arcane_domain }}"
arcane_compose_dir: "/opt/arcane"
arcane_jwt_secret: "{{ lookup('file', playbook_dir ~ '/../.secrets/arcane-jwt-secret', errors='ignore') | default('arcane-jwt-secret-key-32-chars-long!!', true) }}"
arcane_encryption_key: "{{ lookup('file', playbook_dir ~ '/../.secrets/arcane-encryption-key', errors='ignore') | default('arcane-encryption-key-32-chars!!', true) }}"
arcane_admin_email: "{{ lookup('file', playbook_dir ~ '/../.secrets/arcane-admin-email', errors='ignore') | default('admin@example.com', true) | trim }}"

