---
- name: Ensure CrowdSec deployment directory exists
  ansible.builtin.file:
    path: "{{ crowdsec_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy CrowdSec docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ crowdsec_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start CrowdSec container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ crowdsec_compose_dir }}"
    state: present
    remove_orphans: true

- name: Ensure Traefik bouncer is registered in CrowdSec engine
  ansible.builtin.shell:
    cmd: >
      docker exec crowdsec cscli bouncers inspect traefik-bouncer >/dev/null 2>&1 || docker exec crowdsec cscli bouncers add traefik-bouncer -k "{{ crowdsec_lapi_key }}"
  changed_when: false

- name: Restart CrowdSec Traefik bouncer container to ensure LAPI sync
  ansible.builtin.command:
    cmd: "docker restart crowdsec-traefik-bouncer"
  changed_when: false

- name: Install and enable CrowdSec systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "crowdsec"
    systemd_service_description: "CrowdSec IDS/IPS Security Engine & Bouncer"
    systemd_compose_dir: "{{ crowdsec_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "crowdsec"
