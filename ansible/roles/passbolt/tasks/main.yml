---
- name: Ensure Passbolt deployment directory exists
  ansible.builtin.file:
    path: "{{ passbolt_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Passbolt docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ passbolt_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Passbolt container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ passbolt_compose_dir }}"
    state: present
    remove_orphans: true

- name: Install and enable Passbolt systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "passbolt"
    systemd_service_description: "Passbolt Team Password Manager"
    systemd_compose_dir: "{{ passbolt_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "passbolt"

- name: Retrieve Passbolt init container logs
  ansible.builtin.command:
    cmd: docker logs passbolt-init
  register: passbolt_init_logs
  changed_when: false
  ignore_errors: true

- name: Extract activation link from logs
  ansible.builtin.set_fact:
    passbolt_activation_url: "{{ passbolt_init_logs.stdout | regex_search('https://[a-zA-Z0-9.-]+/setup/start/[a-zA-Z0-9-]+/[a-zA-Z0-9-]+') }}"

- name: Display extracted Passbolt activation link in terminal output
  ansible.builtin.debug:
    msg: "Passbolt Activation Link: {{ passbolt_activation_url }}"
  when: passbolt_activation_url is defined and passbolt_activation_url
