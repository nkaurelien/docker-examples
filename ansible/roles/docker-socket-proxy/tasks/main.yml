---
- name: Ensure socket-proxy deployment directory exists
  ansible.builtin.file:
    path: "{{ socket_proxy_compose_dir }}"
    state: directory
    mode: '0755'

- name: Deploy socket-proxy docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ socket_proxy_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start socket-proxy container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ socket_proxy_compose_dir }}"
    state: present

- name: Install and enable socket-proxy systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "docker-socket-proxy"
    systemd_service_description: "Tecnativa Docker Socket Proxy Hardened Security"
    systemd_compose_dir: "{{ socket_proxy_compose_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "socket-proxy"
