---
- name: Ensure Forgejo deployment and configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - "{{ forgejo_deploy_dir }}"
    - "{{ forgejo_deploy_dir }}/data"
    - "{{ forgejo_deploy_dir }}/data/gitea"
    - "{{ forgejo_deploy_dir }}/data/gitea/conf"

- name: Deploy Forgejo app.ini configuration file
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ forgejo_deploy_dir }}/data/gitea/conf/app.ini"
    mode: '0644'

- name: Deploy Forgejo docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_deploy_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Forgejo container stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_deploy_dir }}"
    state: present
    recreate: always
    remove_orphans: true

- name: Initialize Forgejo admin user account via CLI
  community.docker.docker_container_exec:
    container: forgejo
    user: "1000"
    command: "forgejo admin user create --admin --username {{ forgejo_admin_username }} --password '{{ forgejo_admin_password }}' --email '{{ forgejo_admin_email }}'"
  ignore_errors: true

- name: Install and enable Forgejo systemd service for boot startup
  ansible.builtin.include_role:
    name: systemd-service
  vars:
    systemd_service_name: "forgejo"
    systemd_service_description: "Forgejo Self-Hosted Git Platform Service"
    systemd_compose_dir: "{{ forgejo_deploy_dir }}"
    systemd_compose_files: "-f docker-compose.yml"
    systemd_project_name: "forgejo"
