---
# Coolify PaaS role defaults
coolify_image: "ghcr.io/coollabsio/coolify:latest"
coolify_domain: "example.com"
coolify_hostname: "coolify.{{ traefik_domain | default(coolify_domain) }}"
coolify_deploy_dir: "/opt/coolify"
coolify_container_port: 8080
coolify_db_password: "{{ lookup('file', playbook_dir ~ '/../.secrets/coolify-db-password') | trim }}"
coolify_app_key: "{{ lookup('file', playbook_dir ~ '/../.secrets/coolify-app-key') | trim }}"
coolify_admin_email: "{{ lookup('file', playbook_dir ~ '/../.secrets/coolify-admin-email') | trim }}"
coolify_admin_password: "{{ lookup('file', playbook_dir ~ '/../.secrets/coolify-admin-password') | trim }}"
