x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/odoo.svg
  urls:
    - https://www.odoo.com/
    - https://github.com/odoo/odoo

services:
  web:
    image: odoo:14.0
    depends_on:
      - db
    links:
      - db
    ports:
      - "8069:8069"
    volumes:
      - type: volume
        source: odoo-web-data
        target: /var/lib/odoo
      - type: bind
        source: /opt/odoo/odoo14/config
        target: /etc/odoo
      - type: bind
        source: /opt/odoo/odoo14/addons
        target: /mnt/extra-addons
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odoo.rule=Host(`odoo.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.odoo.entrypoints=web"
      - "traefik.http.services.odoo.loadbalancer.server.port=8069"
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/odoo.svg"
  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - type: volume
        source: odoo-db-data
        target: /var/lib/postgresql/data/pgdata
volumes:
  odoo-web-data:
    name: odoo-web-data
  odoo-db-data:
    name: odoo-db-data

networks:
  traefik-public:
    external: true
    name: traefik-public
