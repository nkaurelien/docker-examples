services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    # Provide the FQDN of your mail server here (Your DNS MX record should point to this value)
    hostname: mail.apps.local
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - type: bind
        source: ./docker-data/dms/mail-data/
        target: /var/mail/
      - type: bind
        source: ./docker-data/dms/mail-state/
        target: /var/mail-state/
      - type: bind
        source: ./docker-data/dms/mail-logs/
        target: /var/log/mail/
      - type: bind
        source: ./docker-data/dms/config/
        target: /tmp/docker-mailserver/
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    environment:
      - ENABLE_RSPAMD=1
      - ENABLE_CLAMAV=1
      - ENABLE_FAIL2BAN=1
    cap_add:
      - NET_ADMIN # For Fail2Ban to work
    restart: always

  roundcube:
      image: roundcube/roundcubemail:latest
      container_name: roundcube
      ports:
        - "8005:80"
      volumes:
        - type: bind
          source: ./docker-data/roundcube/config/
          target: /var/www/html/config/
        - type: bind
          source: ./docker-data/roundcube/data/
          target: /var/www/html/logs/
      environment:
        - ROUNDCUBEMAIL_DB_TYPE=sqlite
        - ROUNDCUBEMAIL_DB_PATH=/var/www/html/config/sqlite.db
        - ROUNDCUBEMAIL_SMTP_SERVER=mailserver
        - ROUNDCUBEMAIL_SMTP_PORT=587
        - ROUNDCUBEMAIL_DEFAULT_HOST=mail.apps.local
      depends_on:
        - mailserver
      restart: always