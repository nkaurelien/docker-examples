x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/cyberchef.svg
  urls:
    - https://gchq.github.io/CyberChef/
    - https://github.com/gchq/CyberChef

services:
  cyberchef:
    image: mpepping/cyberchef:latest
    container_name: cyberchef
    restart: unless-stopped
    ports:
      - "8087:8000"
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/cyberchef.svg"
      - "traefik.enable=true"
      - "traefik.http.routers.cyberchef.rule=Host(`cyberchef.${DOMAIN:-apps.local}`) || Host(`chef.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.cyberchef.entrypoints=web"
      - "traefik.http.services.cyberchef.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

networks:
  traefik-public:
    external: true
    name: traefik-public
