x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/diagrams-net.webp
  urls:
    - https://app.diagrams.net/
    - https://github.com/jgraph/drawio-app

services:
  drawio:
    image: jgraph/drawio:latest
    container_name: drawio
    restart: unless-stopped
    ports:
      - "8084:8080"
      - "8444:8443"
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/diagrams-net.webp"
      - "traefik.enable=true"
      - "traefik.http.routers.drawio.rule=Host(`diagrams.${DOMAIN:-apps.local}`) || Host(`drawio.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.drawio.entrypoints=web"
      - "traefik.http.services.drawio.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M

networks:
  traefik-public:
    external: true
    name: traefik-public
