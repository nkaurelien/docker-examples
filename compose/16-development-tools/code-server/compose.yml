x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/vscode.webp
  urls:
    - https://coder.com/
    - https://github.com/coder/code-server

services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - PASSWORD=${PASSWORD:-vscode_secure_pass}
      - SUDO_PASSWORD=${SUDO_PASSWORD:-vscode_secure_pass}
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - ./config:/config
      - ./workspace:/config/workspace
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/vscode.webp"
      - "traefik.enable=true"
      - "traefik.http.routers.code-server.rule=Host(`code.${DOMAIN:-apps.local}`) || Host(`vscode.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.code-server.entrypoints=web"
      - "traefik.http.services.code-server.loadbalancer.server.port=8443"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8443/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.10"
          memory: 128M

networks:
  traefik-public:
    external: true
    name: traefik-public
