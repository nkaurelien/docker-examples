x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/apache-spark.svg
  urls:
    - https://spark.apache.org/
    - https://github.com/apache/spark

services:
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: spark-master
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/apache-spark.svg"
      - "traefik.enable=true"
      - "traefik.http.routers.spark-master.rule=Host(`spark.${DOMAIN:-apps.local}`) || Host(`spark-master.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.spark-master.entrypoints=web"
      - "traefik.http.services.spark-master.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          memory: 256M

  spark-worker-1:
    image: bitnami/spark:3.5.0
    container_name: spark-worker-1
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8081:8081"
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2048M
        reservations:
          memory: 512M

  jupyter-spark:
    image: quay.io/jupyter/all-spark-notebook:spark-3.5.0
    container_name: jupyter-spark
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - NOTEBOOK_APP_TOKEN=secret
      - MASTER=spark://spark-master:7077
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/jupyter.svg"
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter-spark.rule=Host(`jupyter.${DOMAIN:-apps.local}`) || Host(`notebook.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.jupyter-spark.entrypoints=web"
      - "traefik.http.services.jupyter-spark.loadbalancer.server.port=8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          memory: 384M

volumes:
  notebooks:
    name: spark-notebooks

networks:
  traefik-public:
    external: true
    name: traefik-public
