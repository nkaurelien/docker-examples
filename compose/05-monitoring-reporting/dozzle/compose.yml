x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/dozzle.svg
  urls:
    - https://dozzle.dev/
    - https://github.com/amir20/dozzle

services:
  dozzle-init:
    image: busybox:latest
    container_name: dozzle-init
    volumes:
      - dozzle-data:/data
    command:
      - sh
      - -c
      - |
        mkdir -p /data
        if [ ! -f /data/notifications.yml ]; then
          printf 'subscriptions: []\ndispatchers:\n  - id: 1\n    name: ntfy\n    type: webhook\n    url: https://ntfy.${DOMAIN:-kamitbrains.fr}/${NTFY_TOPIC:-<INSERT_SECRET_NTFY_TOPIC>}\n    template: |-\n      {\n        "topic": "dozzle-{{ .Container.HostName }}",\n        "title": "{{ .Container.Name }}",\n        "message": "{{ .Detail }}"\n      }\n' > /data/notifications.yml
        fi
        chmod -R 777 /data
    restart: "no"

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    depends_on:
      dozzle-init:
        condition: service_completed_successfully
    environment:
      DOZZLE_ENABLE_MCP: "true"
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle-data:/data
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/dozzle.svg"
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`dozzle.${DOMAIN:-apps.local}`) || Host(`logs.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

networks:
  traefik-public:
    external: true
    name: traefik-public

volumes:
  dozzle-data:
    name: dozzle-data
