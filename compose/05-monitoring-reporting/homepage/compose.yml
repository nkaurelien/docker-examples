x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/homepage.webp
  urls:
    - https://gethomepage.dev/
    - https://github.com/gethomepage/homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.${DOMAIN:-apps.local},localhost
    volumes:
      - ./config:/app/config
      - ./images:/app/public/images:ro
      - ./icons:/app/public/icons:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/homepage.webp"
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${DOMAIN:-apps.local}`) || Host(`home.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
        reservations:
          memory: 64M

networks:
  traefik-public:
    external: true
    name: traefik-public
