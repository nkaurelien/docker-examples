x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/homepage.svg
  urls:
    - https://gethomepage.dev/
    - https://github.com/gethomepage/homepage

services:
  homepage-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: homepage-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOG_LEVEL=info
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - INFO=1
      - EVENTS=1
      - VERSION=1
      - PING=1
      - NETWORKS=1
      - VOLUMES=1
      - IMAGES=1
      - POST=0
    networks:
      - homepage-internal
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    depends_on:
      homepage-socket-proxy:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.${DOMAIN:-apps.local},localhost
    volumes:
      - ./config:/app/config
      - ./images:/app/public/images:ro
      - ./icons:/app/public/icons:ro
    networks:
      - default
      - homepage-internal
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/homepage.svg"
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${DOMAIN:-apps.local}`) || Host(`home.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
        reservations:
          memory: 64M

networks:
  homepage-internal:
    internal: true
  traefik-public:
    external: true
    name: traefik-public

