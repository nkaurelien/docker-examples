x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/umami.svg
  urls:
    - https://umami.is/
    - https://github.com/umami-software/umami

services:
  umami-init:
    image: postgres:16-alpine
    container_name: umami-init
    restart: "no"
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umami}
      POSTGRES_USER: ${POSTGRES_USER:-umami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umami_db_password_change_me}
      ADMIN_USER: ${UMAMI_ADMIN_USER:-admin}
      WEBSITE_NAME: "Personal Portfolio"
      WEBSITE_DOMAIN: "nkaurelien.kamitbrains.fr"
    networks:
      - umami-internal
    entrypoint:
      - sh
      - -c
      - |
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -h umami-db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "
          INSERT INTO public.website (website_id, name, domain, user_id, created_by)
          SELECT gen_random_uuid(), '$$WEBSITE_NAME', '$$WEBSITE_DOMAIN', user_id, user_id
          FROM public.user WHERE username = '$$ADMIN_USER'
          AND NOT EXISTS (SELECT 1 FROM public.website WHERE domain = '$$WEBSITE_DOMAIN');
        "

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
      umami-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-umami}:${POSTGRES_PASSWORD:-umami_db_password_change_me}@umami-db:5432/${POSTGRES_DB:-umami}
      - APP_SECRET=${APP_SECRET:-umami_app_secret_change_me_32char}
      - PORT=3000
    networks:
      - traefik-public
      - umami-internal
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/umami.svg"
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`umami.${DOMAIN:-kamitbrains.fr}`) || Host(`analytics.${DOMAIN:-kamitbrains.fr}`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
      - "traefik.http.routers.umami.middlewares=crowdsec-bouncer@file"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-umami}
      - POSTGRES_USER=${POSTGRES_USER:-umami}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-umami_db_password_change_me}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - umami-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umami} -d ${POSTGRES_DB:-umami}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

volumes:
  umami-db-data:

networks:
  traefik-public:
    external: true
  umami-internal:
    driver: bridge
