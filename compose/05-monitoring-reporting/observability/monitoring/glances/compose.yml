x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/glances.svg
  urls:
    - https://nicolargo.github.io/glances/
    - https://github.com/nicolargo/glances

services:

  #######################################
  # Glances: System monitoring tool
  #######################################
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    privileged: true
    ports:
      - "61208:61208"    # Web UI
      - "61209:61209"    # API
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      # Mount host filesystems for full monitoring
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /etc/os-release
        target: /etc/os-release
        read_only: true
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      # Uncomment for Podman support
      # - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro
    environment:
      - TZ=${TZ:-Europe/Paris}
      - GLANCES_OPT=-w --process-short-name
      # Tell Glances where to find host proc/sys
      - GLANCES_PROC_PATH=/host/proc
      - GLANCES_SYS_PATH=/host/sys
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glances.rule=Host(`glances.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.glances.entrypoints=web"
      - "traefik.http.services.glances.loadbalancer.server.port=61208"
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/glances.svg"

networks:
  traefik-public:
    external: true

    name: traefik-public
