x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/forgejo.svg
  urls:
    - https://forgejo.org/
    - https://codeberg.org/forgejo/forgejo

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:9-rootless
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__DOMAIN=git.${DOMAIN:-apps.local}
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__ROOT_URL=http://git.${DOMAIN:-apps.local}/
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__server__SSH_DOMAIN=git.${DOMAIN:-apps.local}
    ports:
      - "3003:3000"
      - "2222:22"
    volumes:
      - ./data:/data
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/forgejo.svg"
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`git.${DOMAIN:-apps.local}`) || Host(`forgejo.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.forgejo.entrypoints=web"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
        reservations:
          memory: 64M

networks:
  traefik-public:
    external: true
    name: traefik-public
