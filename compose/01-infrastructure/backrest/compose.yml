# Backrest — Web UI & Orchestrator for Restic Backup
# Web UI: https://backrest.example.com

x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/restic.svg
  urls:
    - https://github.com/garethgeorge/backrest

services:
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    restart: unless-stopped
    environment:
      - BACKREST_PORT=9898
      - BACKREST_CONFIG=/config/config.json
      - BACKREST_DATA=/data
      - TZ=Europe/Paris
    volumes:
      - type: volume
        source: backrest-config
        target: /config
      - type: volume
        source: backrest-cache
        target: /cache
      - type: bind
        source: /var/lib/docker/volumes
        target: /userdata/volumes
        read_only: true
      - type: bind
        source: /opt
        target: /userdata/opt
        read_only: true
    ports:
      - "9898:9898"
    networks:
      - traefik-public
      - default
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/restic.svg"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.backrest.rule=Host(`backrest.example.com`)"
      - "traefik.http.routers.backrest.entrypoints=websecure"
      - "traefik.http.routers.backrest.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backrest.middlewares=crowdsec-bouncer@file"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9898/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

volumes:
  backrest-config:
  backrest-cache:

networks:
  traefik-public:
    external: true
