services:
  bind9:
    image: ubuntu/bind9:latest
    container_name: bind9
    restart: unless-stopped
    ports:
      - "53:53"
      - "53:53/udp"
    environment:
      - TZ=${TZ:-Europe/Paris}
      - BIND9_USER=bind
    volumes:
      - type: bind
        source: ./config
        target: /etc/bind
      - type: bind
        source: ./cache
        target: /var/cache/bind
      - type: bind
        source: ./records
        target: /var/lib/bind
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=false"

networks:
  traefik-public:
    external: true
    name: traefik-public
