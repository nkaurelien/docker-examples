services:
  ofelia-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: ofelia-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOG_LEVEL=info
      - CONTAINERS=1
      - EVENTS=1
      - EXEC=1
      - POST=1
      - INFO=1
      - VERSION=1
      - PING=1
    networks:
      - ofelia-internal
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    restart: unless-stopped
    depends_on:
      ofelia-socket-proxy:
        condition: service_healthy
    command: daemon --docker
    environment:
      - DOCKER_HOST=tcp://ofelia-socket-proxy:2375
    networks:
      - ofelia-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

networks:
  ofelia-internal:
    driver: bridge
