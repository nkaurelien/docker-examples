# coturn — relais TURN pour Jitsi (secret partagé : --static-auth-secret passé par compose).
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200
fingerprint
use-auth-secret
no-cli
no-multicast-peers
# Jamais de relais vers le réseau privé ou la boucle locale (sinon le TURN devient un proxy interne).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Débit et quotas par utilisateur (une visio 720p ≈ 2-3 Mbit/s).
user-quota=12
total-quota=1200
max-bps=3000000
# TLS : monter un certificat et décommenter.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
log-file=stdout
