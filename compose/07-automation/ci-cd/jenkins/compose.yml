x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/jenkins.svg
  urls:
    - https://www.jenkins.io/
    - https://github.com/jenkinsci/jenkins

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8082:8080"
      - "50000:50000"
    networks:
      - default
      - traefik-public
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    restart: unless-stopped
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/jenkins.svg"
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.jenkins.entrypoints=web"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"

networks:
  traefik-public:
    external: true

    name: traefik-public
volumes:
  jenkins_home:
    name: jenkins_home
