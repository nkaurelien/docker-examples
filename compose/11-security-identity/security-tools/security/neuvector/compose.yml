services:

  #######################################
  # NeuVector Allinone: Container Security Platform
  # Includes Controller, Enforcer, Manager, and Scanner
  #######################################
  allinone:
    image: neuvector/allinone:${NEUVECTOR_VERSION:-latest}
    container_name: neuvector-allinone
    restart: unless-stopped
    pid: host
    privileged: true
    environment:
      - CLUSTER_JOIN_ADDR=${CLUSTER_JOIN_ADDR:-}
      - NV_PLATFORM_INFO=platform=Docker
    ports:
      - "18300:18300"       # Controller REST API
      - "18301:18301"       # Controller cluster communication
      - "18301:18301/udp"   # Controller cluster communication (UDP)
      - "18400:18400"       # Enforcer communication
      - "18401:18401"       # Enforcer cluster communication
      - "8443:8443"         # Manager web UI (HTTPS)
    volumes:
      - type: bind
        source: /lib/modules
        target: /lib/modules
        read_only: true
      - type: bind
        source: /var/neuvector
        target: /var/neuvector
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys/fs/cgroup
        target: /host/cgroup
        read_only: true
