# OpenLDAP with phpLDAPadmin
# Usage:
#   cp .env.example .env
#   cp -r .secrets.example .secrets   # Or customize passwords in .secrets/
#   docker compose up -d

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-kamitbrains-it}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-kamitbrains.local}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=kamitbrains,dc=local}
      LDAP_ADMIN_PASSWORD_FILE: /run/secrets/ldap_admin_password
      LDAP_CONFIG_PASSWORD_FILE: /run/secrets/ldap_config_password
    secrets:
      - ldap_admin_password
      - ldap_config_password
    ports:
      - "${LDAP_PORT:-389}:389"
      - "${LDAPS_PORT:-636}:636"
    volumes:
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
    networks:
      - ldap-network
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b '' -s base namingContexts || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  init-ldap:
    image: osixia/openldap:1.5.0
    container_name: init-ldap
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=kamitbrains,dc=local}
    secrets:
      - ldap_admin_password
      - ldap_config_password
      - user_aurelien_password
      - user_idriss_password
      - user_michel_password
    volumes:
      - ./scripts/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    networks:
      - ldap-network
    restart: "no"

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "${PHPLDAPADMIN_PORT:-8088}:80"
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - ldap-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

secrets:
  ldap_admin_password:
    file: ./.secrets/ldap_admin_password.txt
  ldap_config_password:
    file: ./.secrets/ldap_config_password.txt
  user_aurelien_password:
    file: ./.secrets/user_aurelien_password.txt
  user_idriss_password:
    file: ./.secrets/user_idriss_password.txt
  user_michel_password:
    file: ./.secrets/user_michel_password.txt

volumes:
  openldap-data:
    driver: local
    name: openldap-data
  openldap-config:
    driver: local
    name: openldap-config

networks:
  ldap-network:
    driver: bridge
    name: ldap-network
