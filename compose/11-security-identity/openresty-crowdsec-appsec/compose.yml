# OpenResty + CrowdSec (bouncer Lua + WAF AppSec)
# https://docs.crowdsec.net/u/bouncers/openresty
# https://docs.crowdsec.net/docs/next/appsec/intro
# Démo locale : réseau Docker dédié (en production : network_mode host, voir README)

services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Paris}
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/nginx crowdsecurity/base-http-scenarios crowdsecurity/http-cve crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      # Enregistre le bouncer « openresty » avec la clé partagée
      - BOUNCER_KEY_openresty=${CROWDSEC_BOUNCER_KEY:?CROWDSEC_BOUNCER_KEY manquant (voir .env.example)}
      # Pas d'enregistrement auprès de l'API centrale (CAPI) pour la démo
      - DISABLE_ONLINE_API=true
    volumes:
      - type: volume
        source: crowdsec-config
        target: /etc/crowdsec
      - type: volume
        source: crowdsec-data
        target: /var/lib/crowdsec/data
      - type: bind
        source: ./crowdsec/acquis.d
        target: /etc/crowdsec/acquis.d
        read_only: true
      - type: bind
        source: ./crowdsec/config.yaml.local
        target: /etc/crowdsec/config.yaml.local
        read_only: true
      # Journaux d'accès écrits par OpenResty
      - type: volume
        source: openresty-logs
        target: /var/log/openresty
        read_only: true
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - waf-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  openresty:
    build:
      context: ./openresty
    image: local/openresty-crowdsec:1.31.1.1
    restart: unless-stopped
    environment:
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY:?CROWDSEC_BOUNCER_KEY manquant (voir .env.example)}
      - CROWDSEC_LAPI_URL=http://crowdsec:8080
      - CROWDSEC_APPSEC_URL=http://crowdsec:7422
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./openresty/nginx.conf
        target: /usr/local/openresty/nginx/conf/nginx.conf
        read_only: true
      - type: bind
        source: ./openresty/conf.d
        target: /etc/nginx/conf.d
        read_only: true
      - type: volume
        source: openresty-logs
        target: /var/log/openresty
    depends_on:
      crowdsec:
        condition: service_healthy
      whoami:
        condition: service_started
    networks:
      - waf-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend de démonstration
  whoami:
    image: traefik/whoami:latest
    restart: unless-stopped
    networks:
      - waf-net

volumes:
  crowdsec-config:
  crowdsec-data:
  openresty-logs:

networks:
  waf-net:
    name: waf-net
