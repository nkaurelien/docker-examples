x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/bentopdf.svg
  urls:
    - https://bentopdf.com/
    - https://github.com/bentopdf/bentopdf

services:
  bentopdf:
    image: bentopdfteam/bentopdf:latest
    container_name: bentopdf
    restart: unless-stopped
    ports:
      - "8088:8080"
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/bentopdf.svg"
      - "traefik.enable=true"
      - "traefik.http.routers.bentopdf.rule=Host(`pdf.${DOMAIN:-apps.local}`) || Host(`bento.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.bentopdf.entrypoints=web"
      - "traefik.http.services.bentopdf.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M

networks:
  traefik-public:
    external: true
    name: traefik-public
