x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/pingvin-share.webp
  urls:
    - https://github.com/stonerl/pingvin-share

services:
  pingvin-share:
    image: stonerd/pingvin-share:latest
    container_name: pingvin-share
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - APP_URL=http://pingvin.${DOMAIN:-apps.local}
      - TRUST_PROXY=true
    volumes:
      - ./data:/opt/app/backend/data
      - ./data/images:/opt/app/frontend/public/img
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/pingvin-share.webp"
      - "traefik.enable=true"
      - "traefik.http.routers.pingvin-share.rule=Host(`pingvin.${DOMAIN:-apps.local}`) || Host(`pingvin-share.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.pingvin-share.entrypoints=web"
      - "traefik.http.services.pingvin-share.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 64M

networks:
  traefik-public:
    external: true
    name: traefik-public
