x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/erugo.svg
  urls:
    - https://github.com/wardy784/erugo

services:
  erugo:
    image: wardy784/erugo:latest
    container_name: erugo
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - default
      - traefik-public
    labels:
      - "com.getarcaneapp.arcane.icon=https://raw.githubusercontent.com/selfhst/icons/main/svg/erugo.svg"
      - "traefik.enable=true"
      - "traefik.http.routers.erugo.rule=Host(`erugo.${DOMAIN:-apps.local}`) || Host(`share.${DOMAIN:-apps.local}`)"
      - "traefik.http.routers.erugo.entrypoints=web"
      - "traefik.http.services.erugo.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M

networks:
  traefik-public:
    external: true
    name: traefik-public
