services:
  geoip-api:
    # Image reconstruite chaque semaine avec la base GeoLite2 (tag aaaa-SS) : tag figé, à monter régulièrement.
    image: ghcr.io/observabilitystack/geoip-api:${GEOIP_API_TAG:-2026-42}
    restart: unless-stopped
    ports:
      # Service interne : boucle locale uniquement (le joindre depuis d'autres conteneurs par le réseau Docker).
      - "${GEOIP_API_BIND:-127.0.0.1}:${GEOIP_API_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Paris}
    # Base commerciale MaxMind (optionnel) : monter le fichier .mmdb et pointer CITY_DB_FILE dessus.
    # volumes:
    #   - ./data/GeoIP2-City.mmdb:/srv/GeoIP2-City.mmdb:ro
    # environment:
    #   CITY_DB_FILE: /srv/GeoIP2-City.mmdb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
